<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Gestion Bibliothèque</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Gestion de Bibliothèque</h1>

    <div class="container">
        <h2>Ajouter un livre</h2>

        <input type="text" id="titre" placeholder="Titre du livre">
        <input type="text" id="auteur" placeholder="Auteur">
        <input type="number" id="annee" placeholder="Année">
        <input type="text" id="categorie" placeholder="Catégorie">

        <button onclick="ajouterLivre()">Ajouter</button>

        <h2>Rechercher un livre</h2>
        <input type="text" id="recherche" placeholder="Chercher par titre..." onkeyup="afficherLivres()">

        <h2>Liste des livres</h2>

        <table>
            <thead>
                <tr>
                    <th>Titre</th>
                    <th>Auteur</th>
                    <th>Année</th>
                    <th>Catégorie</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="listeLivres"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>

</html>
